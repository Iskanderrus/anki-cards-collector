name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global npm@11.6.0
      - run: npm install
      - run: npm run check

  browser:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global npm@11.6.0
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run build:e2e
      - run: xvfb-run -a npm run test:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: store-screenshot
          path: artifacts/store/screenshot-1.png
          if-no-files-found: error

  package:
    needs: [check, browser]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global npm@11.6.0
      - run: npm install
      - run: npm run package:store
      - uses: actions/upload-artifact@v4
        with:
          name: chrome-web-store-package
          path: release/*
          if-no-files-found: error
