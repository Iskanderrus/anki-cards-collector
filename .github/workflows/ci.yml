name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: extension-release-package
          path: release/*.zip
          if-no-files-found: error
          retention-days: 7

  browser:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run build:e2e
      - run: xvfb-run -a npm run test:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: sidepanel-store-preview
          path: artifacts/sidepanel-store-preview.png
          if-no-files-found: error
          retention-days: 7
