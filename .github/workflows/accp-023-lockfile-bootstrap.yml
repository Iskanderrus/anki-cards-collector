name: ACCP-023 lockfile bootstrap

on:
  push:
    branches:
      - accp-023-reproducible-release-build

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: accp-023-reproducible-release-build
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
      - run: npm install --global npm@11.6.0
      - run: npm install --package-lock-only --ignore-scripts
      - name: Commit canonical lockfile
        run: |
          if git diff --quiet -- package-lock.json && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "ACCP-023: lock npm dependency graph"
          git push origin HEAD:accp-023-reproducible-release-build
